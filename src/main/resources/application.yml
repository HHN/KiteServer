app:
  internal:
    api:
      key: ${APP_INTERNAL_API_KEY}

server:
  error:
    include-message: on_param
    include-binding-errors: on_param
  port: 8080
  ssl:
    enabled: false

  tomcat:
    accesslog:
      enabled: true
      directory: logs
      prefix: access_log
      suffix: .log
      file-date-format: .yyyy-MM-dd

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        connection:
          charSet: UTF-8
    show-sql: false
  cache:
    type: jcache

logging:
  level:
    root: INFO
    org.springframework.web: INFO
  file:
    path: ./log

management:
  endpoints:
    web:
      exposure:
        include: "health,info"

openai:
  enabled: true   # kill-switch: set to false to block outbound OpenAI calls immediately
  api:
    key: ${OPENAI_API_KEY}         # kommt aus .env
  model: ${OPENAI_MODEL:gpt-4o}    # Fallback, falls nicht in .env
  temperature: ${OPENAI_TEMPERATURE:0.5}
  max-tokens: ${OPENAI_MAX_TOKENS:2000}

# Resilience4j Circuit Breaker Configuration:
# This mechanism protects the application from cascading failures. 
# It monitors the last 10 requests and "opens" the circuit (stops calls to OpenAI) 
# if the failure rate reaches 50%. After a 2-minute wait, it attempts recovery 
# by allowing 3 trial calls (half-open state).
resilience4j:
  circuitbreaker:
    instances:
      openai:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 2m
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

security:
  api:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
  kite:
    hmac-secret: ${KITE_HMAC_SECRET}
    passphrase: ${KITE_PASSPHRASE:}

# Bucket4j Rate Limiting Configuration:
# This setup protects your API endpoints from abuse and brute-force attacks.
# 1. Metrics Filter: 300 requests/minute per IP on the /metrics hit endpoints
#    (generous enough for school classes sharing one NAT IP).
# 2. AI Filter: 5 requests/10 minutes, keyed by IP + Bearer token, so every
#    client (pupil) gets their own budget. Invalid tokens share one bucket but
#    never reach the expensive OpenAI path (rejected by TokenFilter).
bucket4j:
  enabled: true
  filters:
    - cache-name: buckets
      filter-method: servlet
      filter-order: 1
      url: /metrics/(playthroughs/hit|scenes/.*/hit)
      strategy: first
      rate-limits:
        - cache-key: "getRemoteAddr()"
          bandwidths:
            - capacity: 300
              time: 1
              unit: minutes
    - cache-name: buckets
      filter-method: servlet
      filter-order: 2
      url: /ai
      rate-limits:
        - cache-key: "getRemoteAddr() + '-' + getHeader('Authorization')"
          bandwidths:
            - capacity: 5
              time: 10
              unit: minutes
