name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kite_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build & Test
        run: ./mvnw -B verify

      - name: Dump surefire error details
        if: failure()
        run: |
          for f in target/surefire-reports/*.txt; do
            if grep -qE "Errors: [1-9]|Failures: [1-9]" "$f"; then
              echo "===== $f ====="
              grep -E "Tests run:|Caused by:|default message|^[a-zA-Z.$]+(Exception|Error)" "$f" | sort -u | head -40
            fi
          done

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/*.txt
